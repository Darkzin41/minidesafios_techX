<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade JavaScript - Semana 05</title>
  <style>
    /* Estilo simples para organizar as atividades na página. */
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 30px auto; padding: 0 15px; }
    section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #ccc; }
    label { display: block; margin-bottom: 8px; }
    input, button { padding: 8px; }
    dt { font-weight: bold; margin-top: 10px; }
    dd { margin-left: 0; }
    img { width: 130px; height: 130px; object-fit: contain; }
  </style>
</head>
<body>
  <h1>Atividade JavaScript - Semana 05</h1>

  <section>
    <h2>Parte 1 - Pedidos</h2>
    <p>Os resultados dos pedidos aparecem no console (F12).</p>
  </section>

  <section>
    <h2>Parte 2 - Buscador de CEP</h2>
    <form id="formCep">
      <label for="cep">Digite um CEP:</label>
      <input id="cep" type="text" placeholder="00000-000" maxlength="9">
      <button id="botaoCep" type="submit">Buscar CEP</button>
    </form>
    <p id="statusCep" aria-live="polite"></p>
    <dl id="resultadoCep"></dl>

    <h3>Histórico de buscas</h3>
    <ul id="historicoCep"></ul>
  </section>

  <section>
    <h2>Parte 3 - Mini Pokédex</h2>
    <form id="formPokemon">
      <label for="nomePokemon">Nome do Pokémon:</label>
      <input id="nomePokemon" type="text" placeholder="Ex.: pikachu">
      <button id="botaoPokemon" type="submit">Buscar Pokémon</button>
    </form>
    <p id="statusPokemon" aria-live="polite"></p>
    <div id="resultadoPokemon"></div>
  </section>

  <!-- O JavaScript fica no final para carregar depois do HTML. -->
  <script src="app.js"></script>
</body>
</html>
