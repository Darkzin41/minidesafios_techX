<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade JavaScript - Semana 04</title>
  <style>
    /* Classes usadas nas atividades de DOM e eventos. */
    .destaque { color: tomato; font-weight: bold; }
    .feito { text-decoration: line-through; }
  </style>
</head>
<body>
  <h1 id="titulo">Meu Blog</h1>

  <p class="texto">Primeiro parágrafo</p>
  <p class="texto">Segundo parágrafo</p>

  <form id="formulario">
    <input id="tarefa" type="text" placeholder="Nova tarefa">
    <button type="submit">Adicionar</button>

  <!-- Três itens iniciais para testar o clique na lista. -->

    <li>Primeiro item do HTML</li>
    <li>Segundo item do HTML</li>
    <li>Terceiro item do HTML</li>
